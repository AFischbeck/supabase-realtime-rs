name: Wasm Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  wasm-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-on-failure: "false"

      - name: Get wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | awk -F'"' '/version/ {print $2}')" >> $GITHUB_OUTPUT

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version ${{ steps.wasm-bindgen.outputs.version }}

      - name: Run wasm tests
        env:
          WASM_BINDGEN_TEST_ONLY_NODE: 1
        run: cargo test --target wasm32-unknown-unknown
