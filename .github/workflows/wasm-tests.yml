name: Wasm Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  wasm-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-on-failure: "false"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version $(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version') --locked || cargo install wasm-bindgen-cli

      - name: Install wasm-bindgen-test-runner
        run: cargo install wasm-bindgen-test-runner

      - name: Run wasm tests
        run: cargo test --target wasm32-unknown-unknown
