[package]
name = "supabase-realtime-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
futures = "0.3.31"
tokio-util = "0.7.15"
regex = "1.11.1"
once_cell = "1.21.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.2", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.30.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { package = "tokio_with_wasm", version = "0.9.0", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite-wasm = "0.9.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dotenv = "0.15.0"
postgrest = "1.6.0"
url = "2"
uuid = { version = "1", features = ["v4"] }
supabase-auth = "0.10.14"

[build-dependencies]
dotenv = "0.15.0"
